

services:
  db:
    image: postgres:15-alpine
    container_name: churn_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: churn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn_migrate
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/churn_db
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    # This service runs once and exits - it does not run the API server

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/churn_db
      - API_KEY=dev-api-key-min-32-chars-long
      - API_KEY_HEADER=X-API-Key
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Mount models folder in case we want to swap artifacts without rebuilding
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Override entrypoint to skip migrations (handled by migrate service)
    entrypoint: []

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: churn_dashboard
    environment:
      - API_URL=http://api:8000
      - API_KEY=dev-api-key-min-32-chars-long
      - API_KEY_HEADER=X-API-Key
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
