name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Run pytest with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  cfn-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        # Pinned to the version this template was validated with (see docs/AWS_DEPLOYMENT.md §9)
        run: pip install cfn-lint==1.57.2

      - name: Run cfn-lint
        run: cfn-lint cloudformation/ecs-cluster.yml

  integration-test:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: churn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r requirements-integration.txt

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/churn_test
          TEST_POSTGRES_AVAILABLE: "true"
        run: |
          pytest tests/integration/ -v --tb=short

  docker-build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: churn-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-dashboard:
    name: Build Dashboard Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          load: true
          tags: churn-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate:
    name: Validate CI
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, cfn-lint, integration-test, docker-build-api, docker-build-dashboard]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "Lint/Type Check failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          if [[ "${{ needs.cfn-lint.result }}" != "success" ]]; then
            echo "CloudFormation Lint failed"
            exit 1
          fi
          if [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build-api.result }}" != "success" ]]; then
            echo "API Docker build failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build-dashboard.result }}" != "success" ]]; then
            echo "Dashboard Docker build failed"
            exit 1
          fi
          echo "All CI checks passed"