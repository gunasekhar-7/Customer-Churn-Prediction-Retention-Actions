name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pip-audit

      - name: Run pip-audit (fail on high/critical)
        id: pip-audit
        run: |
          pip-audit --desc --fail-on=high || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Run pytest with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  cfn-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cfn-lint
        # Pinned to the version this template was validated with (see docs/AWS_DEPLOYMENT.md §9)
        run: pip install cfn-lint==1.57.2

      - name: Run cfn-lint
        run: cfn-lint cloudformation/ecs-cluster.yml

  integration-test:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: churn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r requirements-integration.txt

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/churn_test
          TEST_POSTGRES_AVAILABLE: "true"
        run: |
          pytest tests/integration/ -v --tb=short

  docker-build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: churn-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (API)
        uses: anchore/sbom-action@v0
        with:
          image: churn-api:test
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Upload SBOM (API)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api
          path: sbom-api.spdx.json
          retention-days: 30

  docker-build-dashboard:
    name: Build Dashboard Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          load: true
          tags: churn-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Dashboard)
        uses: anchore/sbom-action@v0
        with:
          image: churn-dashboard:test
          format: spdx-json
          output-file: sbom-dashboard.spdx.json

      - name: Upload SBOM (Dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dashboard
          path: sbom-dashboard.spdx.json
          retention-days: 30

  load-test:
    name: Load Test (Locust)
    runs-on: ubuntu-latest
    needs: [docker-build-api, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install locust

      - name: Generate test model artifact
        run: |
          python -m scripts.create_test_artifact
          ls -la models/

      - name: Start API container
        run: |
          docker run -d --name churn-api-test \
            -e DATABASE_URL=sqlite:///./test.db \
            -e API_KEY=dev-api-key-min-32-chars-long \
            -e REDIS_URL="" \
            -p 8000:8000 \
            churn-api:test
          # Wait for API to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "API is ready"
              break
            fi
            sleep 2
          done

      - name: Run Locust load test (30s, 10 users)
        run: |
          locust -f scripts/locustfile.py \
            --headless -u 10 -r 2 --run-time 30s \
            --host http://localhost:8000 \
            --html locust-report.html
          # Exit code from locust (via quitting event) determines pass/fail

      - name: Upload Locust report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-report
          path: locust-report.html
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker stop churn-api-test && docker rm churn-api-test

  validate:
    name: Validate CI
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, cfn-lint, integration-test, docker-build-api, docker-build-dashboard, security-scan, load-test]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]]; then
            echo "Lint/Type Check failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          if [[ "${{ needs.cfn-lint.result }}" != "success" ]]; then
            echo "CloudFormation Lint failed"
            exit 1
          fi
          if [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build-api.result }}" != "success" ]]; then
            echo "API Docker build failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build-dashboard.result }}" != "success" ]]; then
            echo "Dashboard Docker build failed"
            exit 1
          fi
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "Security scan failed"
            exit 1
          fi
          if [[ "${{ needs.load-test.result }}" != "success" ]]; then
            echo "Load test failed"
            exit 1
          fi
          echo "All CI checks passed"