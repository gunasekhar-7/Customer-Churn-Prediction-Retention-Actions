name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest-cov

    - name: Download dataset for testing
      run: |
        curl -s -o /tmp/Telco-Customer-Churn.csv https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv

    - name: Build Model Artifact
      env:
        PYTHONPATH: .
      run: |
        python scripts/train_and_serialize.py

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Test with pytest
      env:
        PYTHONPATH: .
      run: |
        pytest --cov=src --cov-report=xml

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build API Image
      run: docker build -t churn-api:test -f Dockerfile.api .

    - name: Build Dashboard Image
      run: docker build -t churn-dashboard:test -f Dockerfile.dashboard .
